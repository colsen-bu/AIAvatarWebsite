steps:
  # The Docker build in `deploy` already runs `next build`, so on main this
  # step would just build the app a second time. Only run it where there is
  # no deploy: PRs and pushes to other branches.
  test:
    image: node:20-alpine
    commands:
      - npm ci
      - npm run build
    when:
      - event: pull_request
      - event: push
        branch:
          exclude: ${CI_REPO_DEFAULT_BRANCH}

  deploy:
    image: docker:24-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      # Matches the name compose already derives from the repo dir, so the
      # existing containers and chroma volume are reused
      COMPOSE_PROJECT_NAME: aiavatarwebsite
      DOCKER_BUILDKIT: "1"
      OPENAI_API_KEY:
        from_secret: openai_api_key
      RESEND_API_KEY:
        from_secret: resend_api_key
      FROM_EMAIL:
        from_secret: from_email
      CONTACT_EMAIL:
        from_secret: contact_email
      PAGES_PASSWORD:
        from_secret: pages_password
    commands:
      # No `down` first: `up --build` swaps the container in place and leaves
      # chromadb running
      - docker compose up -d --build
      - docker image prune -f --filter "dangling=true"
      - echo "Waiting for services to start..."
      - sleep 10
      - echo "Running content ingestion..."
      - docker exec colsenai-website npm run ingest-content
    when:
      - event: [push, manual]
        branch: ${CI_REPO_DEFAULT_BRANCH}

  notify:
    image: alpine:latest
    commands:
      - echo "✅ ColsenAI Website deployed successfully!"
    when:
      - event: [push, manual]
        branch: ${CI_REPO_DEFAULT_BRANCH}
        status: [success]
